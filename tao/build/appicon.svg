<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- O ronsel esváese en anel arredor do punto aceso: así o esvaecemento segue a
         forma do rastro en vez de cortalo cunha liña recta. -->
    <radialGradient id="wake" cx="706" cy="512" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0.08" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#10b981" stop-opacity="0.58"/>
      <stop offset="1"    stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0"   stop-color="#6ee7b7" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="#1c1917"/>
  <path d="M 676 512 L -120 186 L -120 838 Z" fill="url(#wake)"/>
  <circle cx="706" cy="512" r="164" fill="url(#glow)"/>
  <circle cx="706" cy="512" r="70" fill="#ffffff"/>
</svg>
